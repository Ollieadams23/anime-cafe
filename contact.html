<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ANIME-CAFE | Contact</title>
	<link rel="icon" href="assets/images/favicon.jpeg" type="image/x-icon">
	<link rel="stylesheet" href="assets/css/style.css">
	<script src="scripts/index.js" defer></script>
</head>
<body>
	<div id="site-header"></div>
	<main class="contact-main">
		<h1>Contact</h1>
		<p>Find our contact details and get in touch.</p>
        <p>Phone: +81 123-456-7890</p>
        <p>Email: cafe@animecafe.com</p>
        <p>Address: 123 Anime Street, Tokyo, Japan</p>
        <p>Opening Hours: Mon-Fri 8am - 8pm, Sat-Sun 9am - 10pm</p>
        <div id="success-message" class="success-message" style="display:none;">
            <p>✓ Thank you for your message! We will get back to you soon.</p>
        </div>
        <form id="contact-form" onsubmit="handleContactSubmit(event)">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Your Name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Your Email" required>
            <label for="message">Message:</label>
            <textarea id="message" name="message" placeholder="Your Message" required></textarea>
            <button type="submit" style="height:50px">Submit</button>
        </form>
    </main>
    <script>
        function handleContactSubmit(event) {
            event.preventDefault();
            const form = document.getElementById('contact-form');
            const successMessage = document.getElementById('success-message');
            
            // Show success message
            successMessage.style.display = 'block';
            
            // Clear form
            form.reset();
            
            // Hide success message after 5 seconds
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
